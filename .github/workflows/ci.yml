name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  DATABASE_URL: postgresql://codecoach:codecoach@127.0.0.1:5432/codecoach_test
  REDIS_ENABLED: 'false'
  ENVIRONMENT: testing
  JWT_SECRET_KEY: ci-test-secret-key-for-testing-only-32chars!!
  GROQ_API_KEY: ci-dummy-key

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: codecoach_test
          POSTGRES_USER: codecoach
          POSTGRES_PASSWORD: codecoach
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codecoach -d codecoach_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tests/test_requirements.txt

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format . --check

      - name: Env-hermeticity guard (hostile local .env must not change results)
        run: |
          printf 'REDIS_ENABLED=false\nENVIRONMENT=development\nJWT_SECRET_KEY=hostile-secret\nUSER_RATE_LIMIT_PER_MINUTE=1\n' > .env
          pytest tests/unit/test_settings.py tests/unit/test_debug_guard.py -q -p no:cacheprovider --no-cov -o log_cli=false --maxfail=0
          rm .env

      - name: Run unit tests
        run: |
          pytest tests/unit -v --cov=app --cov-report=xml:unit-coverage.xml --cov-append --maxfail=0

      - name: Run integration tests
        run: |
          pytest tests/integration -v --cov=app --cov-report=xml:integration-coverage.xml --cov-append \
            --ignore=tests/integration/test_run_endpoints.py \
            --ignore=tests/integration/test_auth_supabase.py \
            --ignore=tests/integration/test_database_sync.py \
            --maxfail=0

      - name: Run contract + failure-simulation tests
        run: |
          pytest tests/contract tests/integration/test_external_failures.py -v --no-cov \
            --cov-report= --cov-fail-under=0 --maxfail=0

      - name: Run boundary condition tests
        run: |
          pytest tests/unit/test_boundary_conditions.py -v --cov-append --maxfail=0

      - name: Run security tests
        run: |
          pytest tests/security -v --cov-append --maxfail=0

      - name: Run smoke tests
        run: |
          pytest tests/integration -k "test_health_check_basic" -v --cov-append --maxfail=0

      - name: Combine coverage and enforce per-module budget
        run: |
          coverage xml -o coverage.xml
          python ../qa/enforce_coverage_budget.py \
            --xml coverage.xml \
            --budget ../qa/coverage-budget.json \
            --baseline ../qa/coverage-baseline.json

      - name: Validate flaky-quarantine manifest
        run: |
          python tests/enforce_flaky_quarantine.py

  migration-test:
    name: Migration Tests
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://codecoach:codecoach@127.0.0.1:5432/codecoach_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codecoach
          POSTGRES_PASSWORD: codecoach
          POSTGRES_DB: codecoach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codecoach"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tests/test_requirements.txt

      - name: Run migration tests (isolated schema)
        run: |
          pytest tests/migrations -v --no-cov --cov-report= --cov-fail-under=0 --maxfail=0

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
        id: pnpm-cache

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Run tests
        run: pnpm run test:run

      - name: Validate flaky-quarantine manifest
        run: |
          node -e "const m=require('./flaky-quarantine.json'); if(m.schema_version!==1||!Array.isArray(m.quarantined)) throw new Error('bad manifest'); for(const e of m.quarantined){for(const k of ['node_id','reason','owner','fix_by']) if(!e[k]) throw new Error('entry missing '+k);} console.log('flaky-quarantine OK');"

      - name: OpenNext Cloudflare build
        env:
          API_URL: ${{ vars.API_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: pnpm run cf:build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Compose
        run: docker compose build --no-cache
