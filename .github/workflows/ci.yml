name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: codecoach_test
          MYSQL_USER: codecoach
          MYSQL_PASSWORD: codecoach
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      piston:
        image: ghcr.io/engineer-man/piston:latest
        ports:
          - 2000:2000
        options: >-
          --health-cmd="node -e \"require('http').get('http://127.0.0.1:2000/api/v2/runtimes',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Piston runtimes
        run: |
          python - <<'EOF'
          import json, time, urllib.request

          runtimes = [
              {"language": "python", "version": "3.10.0"},
              {"language": "python", "version": "3.11.0"},
              {"language": "javascript", "version": "18.15.0"},
              {"language": "java", "version": "15.0.2"},
          ]
          for r in runtimes:
              body = json.dumps(r).encode()
              req = urllib.request.Request(
                  "http://127.0.0.1:2000/api/v2/packages",
                  data=body,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              urllib.request.urlopen(req, timeout=120)
              time.sleep(2)
          EOF

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format . --check

      - name: Type check with mypy
        run: mypy app/
        env:
          ENVIRONMENT: "testing"
          JWT_SECRET_KEY: "ci-test-secret-key-32chars-long!!!!!"

      - name: Run unit tests
        run: python -m pytest tests/unit/ -v --tb=short
        env:
          JWT_SECRET_KEY: "ci-test-secret-key-32chars-long!!!!!"
          DATABASE_URL: "mysql+aiomysql://codecoach:codecoach@127.0.0.1:3306/codecoach_test"
          PISTON_API_URL: "http://127.0.0.1:2000/api/v2"
          NVIDIA_API_KEY: "ci-test-nvidia-key"

      - name: Run integration tests
        run: python -m pytest tests/integration/ -q --tb=short --no-cov
        env:
          JWT_SECRET_KEY: "ci-test-secret-key-32chars-long!!!!!"
          DATABASE_URL: "mysql+aiomysql://codecoach:codecoach@127.0.0.1:3306/codecoach_test"
          PISTON_API_URL: "http://127.0.0.1:2000/api/v2"
          NVIDIA_API_KEY: "ci-test-nvidia-key"

      - name: Run security tests
        run: python -m pytest tests/security/ -q --tb=short --no-cov
        env:
          JWT_SECRET_KEY: "ci-test-secret-key-32chars-long!!!!!"
          DATABASE_URL: "mysql+aiomysql://codecoach:codecoach@127.0.0.1:3306/codecoach_test"
          PISTON_API_URL: "http://127.0.0.1:2000/api/v2"
          NVIDIA_API_KEY: "ci-test-nvidia-key"

      - name: Run performance tests
        run: python -m pytest tests/performance/ -q --tb=short --no-cov
        env:
          JWT_SECRET_KEY: "ci-test-secret-key-32chars-long!!!!!"
          DATABASE_URL: "mysql+aiomysql://codecoach:codecoach@127.0.0.1:3306/codecoach_test"
          PISTON_API_URL: "http://127.0.0.1:2000/api/v2"
          NVIDIA_API_KEY: "ci-test-nvidia-key"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
        id: pnpm-cache

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Run tests
        run: pnpm run test:run

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Compose
        run: docker compose build --no-cache
