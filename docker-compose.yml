services:
  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codecoach-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - PISTON_API_URL=http://piston:2000/api/v2
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=true
      - DAILY_TOKEN_INPUT_CAP=${DAILY_TOKEN_INPUT_CAP:-250000}
      - DAILY_TOKEN_OUTPUT_CAP=${DAILY_TOKEN_OUTPUT_CAP:-125000}
      - USER_RATE_LIMIT_PER_MINUTE=${USER_RATE_LIMIT_PER_MINUTE:-60}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
    depends_on:
      - piston
      - redis
    networks:
      - codecoach-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, json, sys; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health/')); sys.exit(0 if d['dependencies']['questions_db'] == 'ok' else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - API_URL=${API_URL:-http://backend:8000}
        # ':-' would treat an explicit empty .env value as unset and
        # re-inline http://localhost:8000, which CSP then blocks.
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL-http://localhost:8000}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    container_name: codecoach-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    depends_on:
      - backend
    networks:
      - codecoach-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: codecoach-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - codecoach-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3

  # Piston Code Execution Engine
  piston:
    image: ghcr.io/engineer-man/piston:latest
    container_name: codecoach-piston
    restart: unless-stopped
    ports:
      - "2000:2000"
    privileged: true
    volumes:
      - piston-data:/piston
    networks:
      - codecoach-network
    environment:
      - PISTON_DISABLE_NETWORK_ACCESS=true
      # The default 1024-byte stdout cap is too small for the animation trace
      # (one event per algorithm step) and for solutions that print several
      # lines. 64KB comfortably fits a full bubble-sort trace.
      - PISTON_OUTPUT_MAX_SIZE=65536
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:2000/api/v2/runtimes',r=>process.exit(r.statusCode==200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  codecoach-network:
    driver: bridge

volumes:
  piston-data:
    external: true
  redis-data:
