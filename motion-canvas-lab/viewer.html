<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CodeCoach — Animation Viewer</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b0f19;
        overflow: hidden;
      }
      #stage-canvas {
        width: 100vw;
        height: 100vh;
        object-fit: contain;
        display: block;
        background: #0b0f19;
      }

      /* Playback overlay (controls live outside the canvas) */
      #viewer-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        padding: 16px;
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
        color: #e2e8f0;
      }

      /* Narration bar */
      #viewer-narration {
        pointer-events: none;
        max-width: min(680px, calc(100vw - 48px));
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(2, 6, 23, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(8px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        font-size: 13px;
        line-height: 1.4;
      }

      #viewer-step-chip {
        flex-shrink: 0;
        padding: 2px 10px;
        border-radius: 999px;
        background: rgba(16, 185, 129, 0.16);
        border: 1px solid rgba(16, 185, 129, 0.28);
        color: #6ee7b7;
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
      }

      #viewer-narration-text {
        color: #cbd5e1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #viewer-narration.viewer-narration-error {
        border-color: rgba(248, 113, 113, 0.35);
      }

      #viewer-narration.viewer-narration-error #viewer-step-chip {
        background: rgba(248, 113, 113, 0.14);
        border-color: rgba(248, 113, 113, 0.35);
        color: #fca5a5;
      }

      #viewer-narration.viewer-narration-complete #viewer-step-chip {
        background: rgba(56, 189, 248, 0.14);
        border-color: rgba(56, 189, 248, 0.3);
        color: #7dd3fc;
      }

      /* Control bar */
      #viewer-controls {
        pointer-events: auto;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-radius: 999px;
        background: rgba(2, 6, 23, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(8px);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
      }

      .viewer-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border: none;
        border-radius: 999px;
        background: transparent;
        color: #94a3b8;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease;
      }

      .viewer-btn:hover {
        background: rgba(255, 255, 255, 0.08);
        color: #e2e8f0;
      }

      .viewer-btn:active {
        transform: scale(0.94);
      }

      .viewer-btn:focus-visible,
      .viewer-speed-btn:focus-visible,
      #viewer-scrubber:focus-visible {
        outline: 2px solid #10b981;
        outline-offset: 2px;
      }

      .viewer-btn-primary {
        width: 44px;
        height: 44px;
        background: rgba(16, 185, 129, 0.18);
        color: #34d399;
      }

      .viewer-btn-primary:hover {
        background: rgba(16, 185, 129, 0.3);
        color: #6ee7b7;
      }

      #viewer-scrubber {
        width: min(320px, 30vw);
        height: 4px;
        -webkit-appearance: none;
        appearance: none;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        cursor: pointer;
      }

      #viewer-scrubber::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #34d399;
        border: 2px solid #0b0f19;
        box-shadow: 0 0 0 1px rgba(52, 211, 153, 0.4);
      }

      #viewer-scrubber::-moz-range-thumb {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #34d399;
        border: 2px solid #0b0f19;
      }

      #viewer-time {
        min-width: 88px;
        text-align: center;
        font-size: 11px;
        color: #64748b;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }

      #viewer-speed {
        display: flex;
        gap: 4px;
        padding-left: 6px;
        border-left: 1px solid rgba(255, 255, 255, 0.08);
      }

      .viewer-speed-btn {
        padding: 4px 10px;
        border: none;
        border-radius: 999px;
        background: transparent;
        color: #64748b;
        font-size: 11px;
        font-family: inherit;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
      }

      .viewer-speed-btn:hover {
        color: #cbd5e1;
      }

      .viewer-speed-btn-active {
        background: rgba(255, 255, 255, 0.1);
        color: #e2e8f0;
      }

      @media (max-width: 640px) {
        #viewer-overlay {
          padding: 10px;
        }

        #viewer-narration {
          font-size: 11px;
          padding: 6px 12px;
        }

        #viewer-controls {
          gap: 6px;
          padding: 8px 10px;
        }

        #viewer-scrubber {
          width: 40vw;
        }

        #viewer-time {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #viewer-narration,
        #viewer-controls {
          backdrop-filter: none;
        }
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/viewer-player.ts"></script>
  </body>
</html>
