[pytest]
# Pytest configuration for CodeCoach AI API testing

# Test discovery
minversion = 7.0
# NOTE: addopts must stay on a single logical line (pytest 9 ignores
# indented multi-line values, silently disabling coverage gates).
# No --cov-fail-under here: CI splits coverage across unit + integration runs
# (neither alone reaches 85%), and qa/enforce_coverage_budget.py enforces the
# per-module regression floors on the COMBINED coverage in CI.
addopts = -ra --strict-markers --strict-config --cov=app --cov-report=term-missing --cov-report=json:coverage.json --cov-report=xml:coverage.xml --cov-branch -p no:warnings --tb=short --maxfail=5 -v

# Test paths
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Async testing
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    performance: marks tests as performance tests
    security: marks tests as security tests
    boundary: marks tests as boundary condition tests
    smoke: marks tests as smoke tests
    regression: marks tests as regression tests
    api: marks tests as API tests
    load: marks tests as load tests
    e2e: marks tests as end-to-end tests

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test output
console_output_style = progress

# Coverage configuration
[coverage:run]
source = app
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    */site-packages/*
    */dist-packages/*
    */build/*
    */tmp/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    class .*\(Protocol\):
    @(abc\.)?abstractmethod

[coverage:html]
directory = htmlcov

[coverage:xml]
output = coverage.xml
