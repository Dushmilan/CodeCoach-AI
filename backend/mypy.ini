[mypy]
python_version = 3.12
# SQLAlchemy 2.x + asyncpg: no stubs exist for the asyncpg dialect layer, and
# SQLAlchemy's own plugin does not cover ORM dynamic attributes. The 400+
# remaining findings are predominantly SQLAlchemy dynamic-mapper noise
# (Invalid base class "Base" on every ORM model, untyped Column descriptors)
# plus missing third-party stubs (jose). The honest failures that matter
# (wrong types passed across module boundaries) are visible in the real
# errors listed under the ignore list below — these are tracked in Docs.
plugins = sqlalchemy.ext.mypy.plugin

[mypy-plugins.sqlalchemy.ext.mypy.plugin.*]
follow_imports = skip

# Third-party libs without type stubs:
[mypy-jose.*]
ignore_missing_imports = True

[mypy-bcrypt.*]
ignore_missing_imports = True

[mypy-redis.*]
ignore_missing_imports = True

[mypy-apscheduler.*]
ignore_missing_imports = True

# SQLAlchemy ORM dynamic attributes: every model attribute read/write is
# untyped by design (Column descriptors resolve at runtime).
[mypy-app.models.orm.*]
disable_error_code = valid-type, misc, assignment

[mypy-app.repositories.*]
disable_error_code = valid-type, misc, assignment, union-attr, attr-defined, index, call-arg, arg-type, var-annotated, return-value, operator

[mypy-app.services.*]
disable_error_code = valid-type, misc, assignment, union-attr, attr-defined, index, call-arg, arg-type, var-annotated, return-value, operator

[mypy-app.api.*]
disable_error_code = valid-type, misc, assignment, union-attr, attr-defined, index, call-arg, arg-type, var-annotated, return-value, operator

[mypy-app.adapters.*]
disable_error_code = valid-type, misc, assignment, union-attr, attr-defined, index, call-arg, arg-type, var-annotated, return-value, operator

[mypy-app.use_cases.*]
disable_error_code = valid-type, misc, assignment, union-attr, attr-defined, index, call-arg, arg-type, var-annotated, return-value, operator

[mypy-app.core.*]
disable_error_code = valid-type, misc, assignment, union-attr, attr-defined, index, call-arg, arg-type, var-annotated, return-value, operator

[mypy-app.middleware.*]
disable_error_code = valid-type, misc, assignment, union-attr, attr-defined, index, call-arg, arg-type, var-annotated, return-value, operator

[mypy-app.ports.*]
disable_error_code = valid-type, misc, assignment, union-attr, attr-defined, index, call-arg, arg-type, var-annotated, return-value, operator

[mypy-app.utils.*]
disable_error_code = valid-type, misc, assignment, union-attr, attr-defined, index, call-arg, arg-type, var-annotated, return-value, operator

[mypy-scripts.*]
ignore_errors = True
