[mypy]
python_version = 3.11
# NOTE: SQLAlchemy's mypy plugin is intentionally NOT enabled. With mypy 1.20
# it generates an empty-args __init__ for mapped classes (breaking constructor
# kwargs). The SQLAlchemy 2.0 Mapped[...] style works without the plugin because
# Mapped[T] is a descriptor whose __get__ unwraps to T.
# Pydantic's plugin IS enabled: it makes mypy understand Field(...) defaults
# and generates correct __init__ signatures for BaseModel subclasses.
plugins = pydantic.mypy
ignore_missing_imports = True
check_untyped_defs = True
warn_unused_ignores = False
no_implicit_optional = True
